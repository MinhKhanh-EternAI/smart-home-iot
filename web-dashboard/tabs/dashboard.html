            <section id="tab-dashboard" class="tab-content active">
                <!-- Sensors Header -->
                <div class="device-section-title-row">
                    <i class="fa-solid fa-temperature-half"></i>
                    <h2>Cảm biến Môi trường</h2>
                </div>

                <div class="sensors-grid">
                    <!-- Temperature -->
                    <div class="sensor-card temp-card temp-container">
                        <div class="sensor-header">
                            <div class="sensor-icon-circle temp-icon-bg">
                                <i class="fa-solid fa-temperature-half"></i>
                            </div>
                            <h3>Nhiệt độ</h3>
                        </div>
                        <div class="gauge-svg-wrapper">
                            <svg class="gauge-svg-circular" viewBox="0 0 120 120">
                                <path class="gauge-track-circular" d="M 28.18 91.82 A 45 45 0 1 1 91.82 91.82" />
                                <path class="gauge-fill-circular temp-fill-circular" id="temp-gauge-circular" d="M 28.18 91.82 A 45 45 0 1 1 91.82 91.82" />
                            </svg>
                            <div class="gauge-center-circular">
                                <div class="gauge-value-row">
                                    <span class="gauge-value-circular" id="temp-val">--</span>
                                    <span class="gauge-unit-circular">°C</span>
                                </div>
                            </div>
                        </div>
                        <div class="sensor-footer-text">Nhiệt độ</div>
                    </div>
                    <!-- Humidity -->
                    <div class="sensor-card hum-card hum-container">
                        <div class="sensor-header">
                            <div class="sensor-icon-circle hum-icon-bg">
                                <i class="fa-solid fa-droplet"></i>
                            </div>
                            <h3>Độ ẩm</h3>
                        </div>
                        <div class="gauge-svg-wrapper">
                            <svg class="gauge-svg-circular" viewBox="0 0 120 120">
                                <path class="gauge-track-circular" d="M 28.18 91.82 A 45 45 0 1 1 91.82 91.82" />
                                <path class="gauge-fill-circular hum-fill-circular" id="hum-gauge-circular" d="M 28.18 91.82 A 45 45 0 1 1 91.82 91.82" />
                            </svg>
                            <div class="gauge-center-circular">
                                <div class="gauge-value-row">
                                    <span class="gauge-value-circular" id="hum-val">--</span>
                                    <span class="gauge-unit-circular">%</span>
                                </div>
                            </div>
                        </div>
                        <div class="sensor-footer-text">Độ ẩm</div>
                    </div>
                    <!-- Chart -->
                    <div class="sensor-card chart-card">
                        <div class="sensor-header">
                            <i class="fa-solid fa-chart-line icon" style="color: var(--accent);"></i>
                            <h3>Lịch sử biến động Nhiệt độ &amp; Độ ẩm</h3>
                        </div>
                        <div class="chart-container-wrapper" style="position: relative; height: 200px; width: 100%;">
                            <canvas id="temp-hum-chart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Connection Header -->
                <div class="device-section-title-row">
                    <i class="fa-solid fa-circle-nodes"></i>
                    <h2>Trạng thái Kết nối</h2>
                </div>

                <div class="device-status-row-dashboard" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin: 15px 0 25px 0;">
                    <div class="glass-card" id="status-esp8266" style="padding: 12px 18px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between;">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <div style="width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(74, 144, 226, 0.1); color: var(--accent);">
                                <i class="fa-solid fa-microchip" style="font-size: 1.1rem;"></i>
                            </div>
                            <div>
                                <h4 style="margin: 0; font-weight: 600; font-size: 0.95rem;">ESP8266 Core (Mạch chính)</h4>
                                <span class="device-ip-lbl" style="font-size: 0.78rem; opacity: 0.7;">IP: Đang quét...</span>
                            </div>
                        </div>
                        <span class="badge offline" id="badge-esp8266" style="padding: 4px 10px; font-size: 11px;">Offline</span>
                    </div>
                </div>

                <!-- Devices Header -->
                <div class="device-section-title-row">
                    <i class="fa-solid fa-microchip"></i>
                    <h2>Thiết bị</h2>
                </div>
                <div class="devices-grid" id="devices-container">
                    <!-- Indoor Light -->
                    <div class="device-card" data-zone="indoor">
                        <div class="device-header">
                            <div class="device-title">
                                <div class="device-icon-wrapper">
                                    <i class="fa-solid fa-lightbulb device-icon"></i>
                                </div>
                                <div>
                                    <h3>Đèn Trong Nhà</h3>
                                    <span class="device-location">Phòng khách</span>
                                </div>
                            </div>
                            <label class="switch">
                                <input type="checkbox" id="indoor-light-toggle">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="device-body">
                            <div class="info-row">
                                <i class="fa-solid fa-toggle-on"></i> Bật/tắt đèn bằng công tắc trên.
                            </div>
                        </div>
                    </div>
                    <!-- Smart Door -->
                    <div class="device-card" data-zone="outdoor">
                        <div class="device-header">
                            <div class="device-title">
                                <div class="device-icon-wrapper">
                                    <i class="fa-solid fa-lock device-icon" id="door-icon"></i>
                                </div>
                                <div>
                                    <h3>Cửa Thông Minh</h3>
                                    <span class="device-location">Cửa chính</span>
                                </div>
                            </div>
                            <span class="badge" id="door-status-badge">Đóng</span>
                        </div>
                        <div class="device-body flex-col">
                            <div class="door-btn-row">
                                <button class="door-btn door-btn-open" id="door-open-btn">
                                    <i class="fa-solid fa-unlock"></i> Mở cửa
                                </button>
                                <button class="door-btn door-btn-close" id="door-close-btn">
                                    <i class="fa-solid fa-lock"></i> Đóng cửa
                                </button>
                            </div>
                            <div class="slider-config-row">
                                <span>Tự động đóng sau:</span>
                                <div class="slider-val-box">
                                    <input type="range" id="door-autoclose-range" min="3" max="30" value="5">
                                    <span id="door-autoclose-lbl">5s</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
