<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home IoT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=1.0.34">
    <link rel="icon" href="data:,">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="light-mode">
    <script>
        // Áp dụng theme tức thì trước khi render DOM để tránh chớp màn hình (flash of dark mode)
        const savedTheme = localStorage.getItem("theme") || "light";
        if (savedTheme === "dark") {
            document.body.classList.remove("light-mode");
        }
    </script>
    <div class="glass-bg"></div>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-house-laptop logo-icon"></i>
                <h2>SmartHome</h2>
            </div>
            <nav class="menu">
                <a href="#dashboard" class="menu-item active" data-tab="dashboard">
                    <i class="fa-solid fa-gauge"></i> <span>Dashboard</span>
                </a>
                <a href="#rfid" class="menu-item" data-tab="rfid">
                    <i class="fa-solid fa-id-card"></i> <span>RFID Manager</span>
                </a>
                <a href="#logs" class="menu-item" data-tab="logs">
                    <i class="fa-solid fa-list-ul"></i> <span>Event Logs</span>
                </a>
            </nav>
            <div class="connection-status" id="db-status">
                <span class="status-dot offline"></span>
                <span class="status-text">Disconnected</span>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div class="header-title">
                    <h1 id="page-title">Hệ thống Điều khiển</h1>
                    <p class="current-date" id="live-time">Thứ Ba, 16 Tháng 6, 2026</p>
                </div>
                <div class="header-right">
                    <button class="theme-toggle-btn" id="btn-theme-toggle" title="Chuyển chế độ Sáng/Tối">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                    <div class="weather-widget">
                        <div class="weather-icon">
                            <i class="fa-solid fa-cloud-sun-rain"></i>
                        </div>
                        <div class="weather-info">
                            <span class="weather-temp" id="weather-temp">28°C</span>
                            <span class="weather-desc" id="weather-desc">Hà Nội - U ám</span>
                        </div>
                    </div>
                </div>
            </header>


            <!-- Tab: Dashboard -->
            <!-- Các tab section sẽ được load động ở đây từ thư mục tabs/ -->
        </main>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-nav">
        <a href="#dashboard" class="mobile-nav-item active" data-tab="dashboard">
            <i class="fa-solid fa-gauge"></i>
            <span>Dashboard</span>
        </a>
        <a href="#rfid" class="mobile-nav-item" data-tab="rfid">
            <i class="fa-solid fa-id-card"></i>
            <span>RFID</span>
        </a>
        <a href="#logs" class="mobile-nav-item" data-tab="logs">
            <i class="fa-solid fa-list-ul"></i>
            <span>Logs</span>
        </a>
    </nav>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Firebase SDK & App Logic -->
    <script type="module" src="app.js?v=1.0.34"></script>
</body>

</html>
